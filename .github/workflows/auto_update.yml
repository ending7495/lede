name: Auto Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *' # 每天凌晨2点（UTC），北京时间上午10点自动同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/coolsnowwolf/lede.git
          git fetch upstream

      - name: Merge upstream changes
        run: |
          git checkout master
          git merge --allow-unrelated-histories --no-edit upstream/master || (echo "Merge conflict, please resolve manually." && exit 1)

      - name: Push to your repo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin master
