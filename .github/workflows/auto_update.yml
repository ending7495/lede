name: Sync Upstream With Local Priority

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 每天凌晨3点自动同步

jobs:
  cleanup-workflows:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all previous workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0

  sync:
    needs: cleanup-workflows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/coolsnowwolf/lede.git
          git fetch upstream

      # 备份本地优先文件
      - name: Backup local-priority files
        run: |
          mkdir -p .sync-backup/dts
          cp -f package/lean/default-settings/files/zzz-default-settings .sync-backup/zzz-default-settings || true
          cp -f feeds.conf.default .sync-backup/feeds.conf.default || true
          cp -f target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6010-re-cs-07.dts .sync-backup/dts/ipq6010-re-cs-07.dts || true

      # 合并上游，遇到冲突以 theirs（上游）为主
      - name: Merge upstream/master (theirs)
        run: |
          git checkout master
          git merge upstream/master -X theirs --allow-unrelated-histories || true

      # 恢复本地优先文件
      - name: Restore local-priority files
        run: |
          cp -f .sync-backup/zzz-default-settings package/lean/default-settings/files/zzz-default-settings || true
          cp -f .sync-backup/feeds.conf.default feeds.conf.default || true
          cp -f .sync-backup/dts/ipq6010-re-cs-07.dts target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6010-re-cs-07.dts || true

      # 检查本地优先文件是否被成功还原，否则终止同步
      - name: Ensure local-priority files are preserved
        id: checkfiles
        run: |
          cmp -s .sync-backup/zzz-default-settings package/lean/default-settings/files/zzz-default-settings
          ret1=$?
          cmp -s .sync-backup/feeds.conf.default feeds.conf.default
          ret2=$?
          cmp -s .sync-backup/dts/ipq6010-re-cs-07.dts target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6010-re-cs-07.dts
          ret3=$?
          if [ "$ret1" != "0" ] || [ "$ret2" != "0" ] || [ "$ret3" != "0" ]; then
            echo "::error ::Local-priority files were overwritten after upstream sync. Aborting push."
            exit 1
          fi

      # 强制添加、提交、推送（仅在本地优先文件未被覆盖时）
      - name: Commit and push changes
        if: steps.checkfiles.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add package/lean/default-settings/files/zzz-default-settings feeds.conf.default target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6010-re-cs-07.dts || true
          git commit -am "Auto sync upstream (with local priority for zzz-default-settings, feeds.conf.default, ipq6010-re-cs-07.dts)" || true
          git push origin master
